<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
      .qr-canvas {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div>
      <h3>QR Code</h3>
      <div id="qrcode"></div>
      <button id="download-btn" style="display: none">Download QR Code</button>
    </div>
    <script>
      function generateQRCode(url, fileName) {
        console.log("Generating QR code with URL:", url);
        console.log("File name for QR code:", fileName);

        const qr = qrcode(0, "L");
        qr.addData(url);
        qr.make();

        const canvas = document.createElement("canvas");
        const size = 490;
        const borderSize = 10;
        canvas.width = size + borderSize * 2;
        canvas.height = size + borderSize * 2;

        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const tileSize = size / qr.getModuleCount();
        ctx.fillStyle = "#000000";
        for (let row = 0; row < qr.getModuleCount(); row++) {
          for (let col = 0; col < qr.getModuleCount(); col++) {
            ctx.fillStyle = qr.isDark(row, col) ? "#000000" : "#FFFFFF";
            ctx.fillRect(
              col * tileSize + borderSize,
              row * tileSize + borderSize,
              tileSize,
              tileSize
            );
          }
        }

        const qrCodeDiv = document.getElementById("qrcode");
        qrCodeDiv.innerHTML = "";
        canvas.classList.add("qr-canvas");
        qrCodeDiv.appendChild(canvas);

        const downloadBtn = document.getElementById("download-btn");
        downloadBtn.style.display = "block";
        downloadBtn.onclick = function () {
          const link = document.createElement("a");
          link.href = canvas.toDataURL("image/png");
          link.download = `${fileName}_Ezeekard_QR.png`;
          link.click();
        };
      }

      function displayQRCode() {
        google.script.run
          .withSuccessHandler(function (data) {
            if (data) {
              console.log("Data received from Google Script:", data);
              const url = data.url;
              const fileName = data.fileName;
              generateQRCode(url, fileName);
            } else {
              document.getElementById("qrcode").innerText =
                "No data available or row not selected.";
            }
          })
          .getSelectedRowDataForURL();
      }

      displayQRCode();
    </script>
  </body>
</html>
